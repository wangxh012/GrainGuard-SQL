tables:
  Ref_Document_Types:
    columns:
      Document_Type_Code: text
      Document_Type_Name: text
      Document_Type_Description: text
    primary_key: &id001
    - Document_Type_Code
    grain: *id001
  Ref_Calendar:
    columns:
      Calendar_Date: time
      Day_Number: number
    primary_key: &id002
    - Calendar_Date
    grain: *id002
  Ref_Locations:
    columns:
      Location_Code: text
      Location_Name: text
      Location_Description: text
    primary_key: &id003
    - Location_Code
    grain: *id003
  Roles:
    columns:
      Role_Code: text
      Role_Name: text
      Role_Description: text
    primary_key: &id004
    - Role_Code
    grain: *id004
  All_Documents:
    columns:
      Document_ID: number
      Date_Stored: time
      Document_Type_Code: text
      Document_Name: text
      Document_Description: text
      Other_Details: text
    primary_key: &id005
    - Document_ID
    grain: *id005
    observed_non_unique:
    - - Date_Stored
    - - Document_Type_Code
    foreign_keys:
    - columns:
      - Date_Stored
      references:
        table: Ref_Calendar
        columns:
        - Calendar_Date
      many_allowed: true
    - columns:
      - Document_Type_Code
      references:
        table: Ref_Document_Types
        columns:
        - Document_Type_Code
      many_allowed: true
  Employees:
    columns:
      Employee_ID: number
      Role_Code: text
      Employee_Name: text
      Gender_MFU: text
      Date_of_Birth: time
      Other_Details: text
    primary_key: &id006
    - Employee_ID
    grain: *id006
    observed_non_unique:
    - - Role_Code
    foreign_keys:
    - columns:
      - Role_Code
      references:
        table: Roles
        columns:
        - Role_Code
      many_allowed: true
  Document_Locations:
    columns:
      Document_ID: number
      Location_Code: text
      Date_in_Location_From: time
      Date_in_Locaton_To: time
    primary_key: &id007
    - Document_ID
    - Location_Code
    - Date_in_Location_From
    grain: *id007
    observed_non_unique:
    - - Document_ID
    - - Date_in_Locaton_To
    - - Date_in_Location_From
    - - Location_Code
    foreign_keys:
    - columns:
      - Document_ID
      references:
        table: All_Documents
        columns:
        - Document_ID
      many_allowed: true
    - columns:
      - Date_in_Locaton_To
      references:
        table: Ref_Calendar
        columns:
        - Calendar_Date
      many_allowed: true
    - columns:
      - Date_in_Location_From
      references:
        table: Ref_Calendar
        columns:
        - Calendar_Date
      many_allowed: true
    - columns:
      - Location_Code
      references:
        table: Ref_Locations
        columns:
        - Location_Code
      many_allowed: true
  Documents_to_be_Destroyed:
    columns:
      Document_ID: number
      Destruction_Authorised_by_Employee_ID: number
      Destroyed_by_Employee_ID: number
      Planned_Destruction_Date: time
      Actual_Destruction_Date: time
      Other_Details: text
    primary_key: &id008
    - Document_ID
    grain: *id008
    observed_non_unique:
    - - Actual_Destruction_Date
    - - Planned_Destruction_Date
    - - Destruction_Authorised_by_Employee_ID
    - - Destroyed_by_Employee_ID
    foreign_keys:
    - columns:
      - Document_ID
      references:
        table: All_Documents
        columns:
        - Document_ID
      many_allowed: true
    - columns:
      - Actual_Destruction_Date
      references:
        table: Ref_Calendar
        columns:
        - Calendar_Date
      many_allowed: true
    - columns:
      - Planned_Destruction_Date
      references:
        table: Ref_Calendar
        columns:
        - Calendar_Date
      many_allowed: true
    - columns:
      - Destruction_Authorised_by_Employee_ID
      references:
        table: Employees
        columns:
        - Employee_ID
      many_allowed: true
    - columns:
      - Destroyed_by_Employee_ID
      references:
        table: Employees
        columns:
        - Employee_ID
      many_allowed: true
