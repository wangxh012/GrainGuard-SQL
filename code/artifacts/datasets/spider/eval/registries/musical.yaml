tables:
  musical:
    columns:
      Musical_ID: number
      Name: text
      Year: number
      Award: text
      Category: text
      Nominee: text
      Result: text
    primary_key: &id001
    - Musical_ID
    grain: *id001
  actor:
    columns:
      Actor_ID: number
      Name: text
      Musical_ID: number
      Character: text
      Duration: text
      age: number
    primary_key: &id002
    - Actor_ID
    grain: *id002
    observed_non_unique:
    - - Musical_ID
    foreign_keys:
    - columns:
      - Musical_ID
      references:
        table: actor
        columns:
        - Actor_ID
      many_allowed: true
