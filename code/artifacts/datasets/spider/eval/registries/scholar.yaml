tables:
  venue:
    columns:
      venueId: number
      venueName: text
    primary_key: &id001
    - venueId
    grain: *id001
  author:
    columns:
      authorId: number
      authorName: text
    primary_key: &id002
    - authorId
    grain: *id002
  dataset:
    columns:
      datasetId: number
      datasetName: text
    primary_key: &id003
    - datasetId
    grain: *id003
  journal:
    columns:
      journalId: number
      journalName: text
    primary_key: &id004
    - journalId
    grain: *id004
  keyphrase:
    columns:
      keyphraseId: number
      keyphraseName: text
    primary_key: &id005
    - keyphraseId
    grain: *id005
  paper:
    columns:
      paperId: number
      title: text
      venueId: number
      year: number
      numCiting: number
      numCitedBy: number
      journalId: number
    primary_key: &id006
    - paperId
    grain: *id006
    foreign_keys:
    - columns:
      - venueId
      references:
        table: venue
        columns:
        - venueId
      many_allowed: true
    - columns:
      - journalId
      references:
        table: journal
        columns:
        - journalId
      many_allowed: true
  cite:
    columns:
      citingPaperId: number
      citedPaperId: number
    primary_key: &id007
    - citingPaperId
    - citedPaperId
    grain: *id007
    foreign_keys:
    - columns:
      - citingPaperId
      references:
        table: paper
        columns:
        - paperId
      many_allowed: true
    - columns:
      - citedPaperId
      references:
        table: paper
        columns:
        - paperId
      many_allowed: true
  paperDataset:
    columns:
      paperId: number
      datasetId: number
    primary_key: &id008
    - datasetId
    - paperId
    grain: *id008
  paperKeyphrase:
    columns:
      paperId: number
      keyphraseId: number
    primary_key: &id009
    - keyphraseId
    - paperId
    grain: *id009
    foreign_keys:
    - columns:
      - keyphraseId
      references:
        table: keyphrase
        columns:
        - keyphraseId
      many_allowed: true
    - columns:
      - paperId
      references:
        table: paper
        columns:
        - paperId
      many_allowed: true
  writes:
    columns:
      paperId: number
      authorId: number
    primary_key: &id010
    - paperId
    - authorId
    grain: *id010
    foreign_keys:
    - columns:
      - authorId
      references:
        table: author
        columns:
        - authorId
      many_allowed: true
    - columns:
      - paperId
      references:
        table: paper
        columns:
        - paperId
      many_allowed: true
