tables:
  Roles:
    columns:
      role_code: text
      role_description: text
    primary_key: &id001
    - role_code
    grain: *id001
  Users:
    columns:
      user_id: number
      role_code: text
      user_name: text
      user_login: text
      password: text
    primary_key: &id002
    - user_id
    grain: *id002
    observed_non_unique:
    - - role_code
    foreign_keys:
    - columns:
      - role_code
      references:
        table: Roles
        columns:
        - role_code
      many_allowed: true
  Document_Structures:
    columns:
      document_structure_code: text
      parent_document_structure_code: text
      document_structure_description: text
    primary_key: &id003
    - document_structure_code
    grain: *id003
  Functional_Areas:
    columns:
      functional_area_code: text
      parent_functional_area_code: text
      functional_area_description: text
    primary_key: &id004
    - functional_area_code
    grain: *id004
  Images:
    columns:
      image_id: number
      image_alt_text: text
      image_name: text
      image_url: text
    primary_key: &id005
    - image_id
    grain: *id005
  Documents:
    columns:
      document_code: text
      document_structure_code: text
      document_type_code: text
      access_count: number
      document_name: text
    primary_key: &id006
    - document_code
    grain: *id006
    observed_non_unique:
    - - document_structure_code
    foreign_keys:
    - columns:
      - document_structure_code
      references:
        table: Document_Structures
        columns:
        - document_structure_code
      many_allowed: true
  Document_Functional_Areas:
    columns:
      document_code: text
      functional_area_code: text
    primary_key: []
    grain: []
    observed_non_unique:
    - - functional_area_code
    - - document_code
    foreign_keys:
    - columns:
      - functional_area_code
      references:
        table: Functional_Areas
        columns:
        - functional_area_code
      many_allowed: true
    - columns:
      - document_code
      references:
        table: Documents
        columns:
        - document_code
      many_allowed: true
  Document_Sections:
    columns:
      section_id: number
      document_code: text
      section_sequence: number
      section_code: text
      section_title: text
    primary_key: &id007
    - section_id
    grain: *id007
    observed_non_unique:
    - - document_code
    foreign_keys:
    - columns:
      - document_code
      references:
        table: Documents
        columns:
        - document_code
      many_allowed: true
  Document_Sections_Images:
    columns:
      section_id: number
      image_id: number
    primary_key: &id008
    - section_id
    - image_id
    grain: *id008
    observed_non_unique:
    - - image_id
    - - section_id
    foreign_keys:
    - columns:
      - image_id
      references:
        table: Images
        columns:
        - image_id
      many_allowed: true
    - columns:
      - section_id
      references:
        table: Document_Sections
        columns:
        - section_id
      many_allowed: true
