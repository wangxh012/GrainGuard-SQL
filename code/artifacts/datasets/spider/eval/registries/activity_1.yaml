tables:
  Activity:
    columns:
      actid: number
      activity_name: text
    primary_key: &id001
    - actid
    grain: *id001
  Participates_in:
    columns:
      stuid: number
      actid: number
    primary_key: []
    grain:
    - stuid
    observed_non_unique:
    - - actid
    - - stuid
    foreign_keys:
    - columns:
      - actid
      references:
        table: Activity
        columns:
        - actid
      many_allowed: true
    - columns:
      - stuid
      references:
        table: Student
        columns:
        - StuID
      many_allowed: true
  Faculty_Participates_in:
    columns:
      FacID: number
      actid: number
    primary_key: []
    grain:
    - FacID
    observed_non_unique:
    - - actid
    - - FacID
    foreign_keys:
    - columns:
      - actid
      references:
        table: Activity
        columns:
        - actid
      many_allowed: true
    - columns:
      - FacID
      references:
        table: Faculty
        columns:
        - FacID
      many_allowed: true
  Student:
    columns:
      StuID: number
      LName: text
      Fname: text
      Age: number
      Sex: text
      Major: number
      Advisor: number
      city_code: text
    primary_key: &id002
    - StuID
    grain: *id002
  Faculty:
    columns:
      FacID: number
      Lname: text
      Fname: text
      Rank: text
      Sex: text
      Phone: number
      Room: text
      Building: text
    primary_key: &id003
    - FacID
    grain: *id003
