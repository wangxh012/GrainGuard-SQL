tables:
  Premises:
    columns:
      premise_id: number
      premises_type: text
      premise_details: text
    primary_key: &id001
    - premise_id
    grain: *id001
  Products:
    columns:
      product_id: number
      product_category: text
      product_name: text
    primary_key: &id002
    - product_id
    grain: *id002
  Customers:
    columns:
      customer_id: number
      payment_method: text
      customer_name: text
      customer_phone: text
      customer_email: text
      customer_address: text
      customer_login: text
      customer_password: text
    primary_key: &id003
    - customer_id
    grain: *id003
  Mailshot_Campaigns:
    columns:
      mailshot_id: number
      product_category: text
      mailshot_name: text
      mailshot_start_date: time
      mailshot_end_date: time
    primary_key: &id004
    - mailshot_id
    grain: *id004
  Customer_Addresses:
    columns:
      customer_id: number
      premise_id: number
      date_address_from: time
      address_type_code: text
      date_address_to: time
    primary_key: []
    grain:
    - customer_id
    observed_non_unique:
    - - customer_id
    - - premise_id
    foreign_keys:
    - columns:
      - customer_id
      references:
        table: Customers
        columns:
        - customer_id
      many_allowed: true
    - columns:
      - premise_id
      references:
        table: Premises
        columns:
        - premise_id
      many_allowed: true
  Customer_Orders:
    columns:
      order_id: number
      customer_id: number
      order_status_code: text
      shipping_method_code: text
      order_placed_datetime: time
      order_delivered_datetime: time
      order_shipping_charges: text
    primary_key: &id005
    - order_id
    grain: *id005
    observed_non_unique:
    - - customer_id
    foreign_keys:
    - columns:
      - customer_id
      references:
        table: Customers
        columns:
        - customer_id
      many_allowed: true
  Mailshot_Customers:
    columns:
      mailshot_id: number
      customer_id: number
      outcome_code: text
      mailshot_customer_date: time
    primary_key: []
    grain:
    - mailshot_id
    observed_non_unique:
    - - mailshot_id
    - - customer_id
    foreign_keys:
    - columns:
      - mailshot_id
      references:
        table: Mailshot_Campaigns
        columns:
        - mailshot_id
      many_allowed: true
    - columns:
      - customer_id
      references:
        table: Customers
        columns:
        - customer_id
      many_allowed: true
  Order_Items:
    columns:
      item_id: number
      order_item_status_code: text
      order_id: number
      product_id: number
      item_status_code: text
      item_delivered_datetime: time
      item_order_quantity: text
    primary_key: []
    grain:
    - item_id
    observed_non_unique:
    - - order_id
    - - product_id
    foreign_keys:
    - columns:
      - order_id
      references:
        table: Customer_Orders
        columns:
        - order_id
      many_allowed: true
    - columns:
      - product_id
      references:
        table: Products
        columns:
        - product_id
      many_allowed: true
