tables:
  Student:
    columns:
      StuID: number
      LName: text
      Fname: text
      Age: number
      Sex: text
      Major: number
      Advisor: number
      city_code: text
    primary_key: &id001
    - StuID
    grain: *id001
  Voting_record:
    columns:
      StuID: number
      Registration_Date: text
      Election_Cycle: text
      President_Vote: number
      Vice_President_Vote: number
      Secretary_Vote: number
      Treasurer_Vote: number
      Class_President_Vote: number
      Class_Senator_Vote: number
    primary_key: []
    grain:
    - StuID
    observed_non_unique:
    - - Class_Senator_Vote
    - - Class_President_Vote
    - - Treasurer_Vote
    - - Secretary_Vote
    - - Vice_President_Vote
    - - President_Vote
    - - StuID
    foreign_keys:
    - columns:
      - Class_Senator_Vote
      references:
        table: Student
        columns:
        - StuID
      many_allowed: true
    - columns:
      - Class_President_Vote
      references:
        table: Student
        columns:
        - StuID
      many_allowed: true
    - columns:
      - Treasurer_Vote
      references:
        table: Student
        columns:
        - StuID
      many_allowed: true
    - columns:
      - Secretary_Vote
      references:
        table: Student
        columns:
        - StuID
      many_allowed: true
    - columns:
      - Vice_President_Vote
      references:
        table: Student
        columns:
        - StuID
      many_allowed: true
    - columns:
      - President_Vote
      references:
        table: Student
        columns:
        - StuID
      many_allowed: true
    - columns:
      - StuID
      references:
        table: Student
        columns:
        - StuID
      many_allowed: true
