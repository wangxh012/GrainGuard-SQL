tables:
  architect:
    columns:
      id: text
      name: text
      nationality: text
      gender: text
    primary_key: &id001
    - id
    grain: *id001
  bridge:
    columns:
      architect_id: number
      id: number
      name: text
      location: text
      length_meters: number
      length_feet: number
    primary_key: &id002
    - id
    grain: *id002
    observed_non_unique:
    - - architect_id
    foreign_keys:
    - columns:
      - architect_id
      references:
        table: architect
        columns:
        - id
      many_allowed: true
  mill:
    columns:
      architect_id: number
      id: number
      location: text
      name: text
      type: text
      built_year: number
      notes: text
    primary_key: &id003
    - id
    grain: *id003
    observed_non_unique:
    - - architect_id
    foreign_keys:
    - columns:
      - architect_id
      references:
        table: architect
        columns:
        - id
      many_allowed: true
