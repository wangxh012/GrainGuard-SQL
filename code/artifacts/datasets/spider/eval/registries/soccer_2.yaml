tables:
  College:
    columns:
      cName: text
      state: text
      enr: number
    primary_key: &id001
    - cName
    grain: *id001
  Player:
    columns:
      pID: number
      pName: text
      yCard: text
      HS: number
    primary_key: &id002
    - pID
    grain: *id002
  Tryout:
    columns:
      pID: number
      cName: text
      pPos: text
      decision: text
    primary_key: &id003
    - pID
    - cName
    grain: *id003
    observed_non_unique:
    - - cName
    - - pID
    foreign_keys:
    - columns:
      - cName
      references:
        table: College
        columns:
        - cName
      many_allowed: true
    - columns:
      - pID
      references:
        table: Player
        columns:
        - pID
      many_allowed: true
