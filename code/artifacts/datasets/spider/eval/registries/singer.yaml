tables:
  singer:
    columns:
      Singer_ID: number
      Name: text
      Birth_Year: number
      Net_Worth_Millions: number
      Citizenship: text
    primary_key: &id001
    - Singer_ID
    grain: *id001
  song:
    columns:
      Song_ID: number
      Title: text
      Singer_ID: number
      Sales: number
      Highest_Position: number
    primary_key: &id002
    - Song_ID
    grain: *id002
    observed_non_unique:
    - - Singer_ID
    foreign_keys:
    - columns:
      - Singer_ID
      references:
        table: singer
        columns:
        - Singer_ID
      many_allowed: true
