tables:
  Customers:
    columns:
      Customer_ID: number
      Customer_name: text
    primary_key: &id001
    - Customer_ID
    grain: *id001
  Services:
    columns:
      Service_ID: number
      Service_name: text
    primary_key: &id002
    - Service_ID
    grain: *id002
  Available_Policies:
    columns:
      Policy_ID: number
      policy_type_code: text
      Customer_Phone: text
    primary_key: &id003
    - Policy_ID
    grain: *id003
  Customers_Policies:
    columns:
      Customer_ID: number
      Policy_ID: number
      Date_Opened: time
      Date_Closed: time
    primary_key: &id004
    - Customer_ID
    - Policy_ID
    grain: *id004
    observed_non_unique:
    - - Policy_ID
    - - Customer_ID
    foreign_keys:
    - columns:
      - Policy_ID
      references:
        table: Available_Policies
        columns:
        - Policy_ID
      many_allowed: true
    - columns:
      - Customer_ID
      references:
        table: Customers
        columns:
        - Customer_ID
      many_allowed: true
  First_Notification_of_Loss:
    columns:
      FNOL_ID: number
      Customer_ID: number
      Policy_ID: number
      Service_ID: number
    primary_key: &id005
    - FNOL_ID
    grain: *id005
    observed_unique:
    - - Policy_ID
    observed_non_unique:
    - - Customer_ID
    - - Service_ID
    foreign_keys:
    - columns:
      - Customer_ID
      references:
        table: Customers_Policies
        columns:
        - Customer_ID
      many_allowed: true
    - columns:
      - Policy_ID
      references:
        table: Customers_Policies
        columns:
        - Policy_ID
      many_allowed: true
    - columns:
      - Service_ID
      references:
        table: Services
        columns:
        - Service_ID
      many_allowed: true
  Claims:
    columns:
      Claim_ID: number
      FNOL_ID: number
      Effective_Date: time
    primary_key: &id006
    - Claim_ID
    grain: *id006
    observed_non_unique:
    - - FNOL_ID
    foreign_keys:
    - columns:
      - FNOL_ID
      references:
        table: First_Notification_of_Loss
        columns:
        - FNOL_ID
      many_allowed: true
  Settlements:
    columns:
      Settlement_ID: number
      Claim_ID: number
      Effective_Date: time
      Settlement_Amount: number
    primary_key: &id007
    - Settlement_ID
    grain: *id007
    observed_unique:
    - - Claim_ID
    foreign_keys:
    - columns:
      - Claim_ID
      references:
        table: Claims
        columns:
        - Claim_ID
      many_allowed: true
