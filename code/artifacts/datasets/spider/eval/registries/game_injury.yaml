tables:
  stadium:
    columns:
      id: number
      name: text
      Home_Games: number
      Average_Attendance: number
      Total_Attendance: number
      Capacity_Percentage: number
    primary_key: &id001
    - id
    grain: *id001
  game:
    columns:
      stadium_id: number
      id: number
      Season: number
      Date: text
      Home_team: text
      Away_team: text
      Score: text
      Competition: text
    primary_key: &id002
    - id
    grain: *id002
    observed_non_unique:
    - - stadium_id
    foreign_keys:
    - columns:
      - stadium_id
      references:
        table: stadium
        columns:
        - id
      many_allowed: true
  injury_accident:
    columns:
      game_id: number
      id: number
      Player: text
      Injury: text
      Number_of_matches: text
      Source: text
    primary_key: &id003
    - id
    grain: *id003
    observed_non_unique:
    - - game_id
    foreign_keys:
    - columns:
      - game_id
      references:
        table: game
        columns:
        - id
      many_allowed: true
