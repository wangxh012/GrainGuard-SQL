tables:
  Customers:
    columns:
      Customer_ID: number
      Customer_Details: text
    primary_key: &id001
    - Customer_ID
    grain: *id001
  Staff:
    columns:
      Staff_ID: number
      Staff_Details: text
    primary_key: &id002
    - Staff_ID
    grain: *id002
  Policies:
    columns:
      Policy_ID: number
      Customer_ID: number
      Policy_Type_Code: text
      Start_Date: time
      End_Date: time
    primary_key: &id003
    - Policy_ID
    grain: *id003
    observed_non_unique:
    - - Customer_ID
    foreign_keys:
    - columns:
      - Customer_ID
      references:
        table: Customers
        columns:
        - Customer_ID
      many_allowed: true
  Claim_Headers:
    columns:
      Claim_Header_ID: number
      Claim_Status_Code: text
      Claim_Type_Code: text
      Policy_ID: number
      Date_of_Claim: time
      Date_of_Settlement: time
      Amount_Claimed: number
      Amount_Piad: number
    primary_key: &id004
    - Claim_Header_ID
    grain: *id004
    observed_non_unique:
    - - Policy_ID
    foreign_keys:
    - columns:
      - Policy_ID
      references:
        table: Policies
        columns:
        - Policy_ID
      many_allowed: true
  Claims_Documents:
    columns:
      Claim_ID: number
      Document_Type_Code: text
      Created_by_Staff_ID: number
      Created_Date: number
    primary_key: &id005
    - Claim_ID
    - Document_Type_Code
    grain: *id005
    observed_non_unique:
    - - Created_by_Staff_ID
    - - Claim_ID
    foreign_keys:
    - columns:
      - Created_by_Staff_ID
      references:
        table: Staff
        columns:
        - Staff_ID
      many_allowed: true
    - columns:
      - Claim_ID
      references:
        table: Claim_Headers
        columns:
        - Claim_Header_ID
      many_allowed: true
  Claims_Processing_Stages:
    columns:
      Claim_Stage_ID: number
      Next_Claim_Stage_ID: number
      Claim_Status_Name: text
      Claim_Status_Description: text
    primary_key: &id006
    - Claim_Stage_ID
    grain: *id006
  Claims_Processing:
    columns:
      Claim_Processing_ID: number
      Claim_ID: number
      Claim_Outcome_Code: text
      Claim_Stage_ID: number
      Staff_ID: number
    primary_key: &id007
    - Claim_Processing_ID
    grain: *id007
    observed_non_unique:
    - - Staff_ID
    - - Claim_ID
    foreign_keys:
    - columns:
      - Staff_ID
      references:
        table: Staff
        columns:
        - Staff_ID
      many_allowed: true
    - columns:
      - Claim_ID
      references:
        table: Claim_Headers
        columns:
        - Claim_Header_ID
      many_allowed: true
