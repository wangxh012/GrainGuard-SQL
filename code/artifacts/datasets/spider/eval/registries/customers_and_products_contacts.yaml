tables:
  Addresses:
    columns:
      address_id: number
      line_1_number_building: text
      city: text
      zip_postcode: text
      state_province_county: text
      country: text
    primary_key: &id001
    - address_id
    grain: *id001
  Products:
    columns:
      product_id: number
      product_type_code: text
      product_name: text
      product_price: number
    primary_key: &id002
    - product_id
    grain: *id002
  Customers:
    columns:
      customer_id: number
      payment_method_code: text
      customer_number: text
      customer_name: text
      customer_address: text
      customer_phone: text
      customer_email: text
    primary_key: &id003
    - customer_id
    grain: *id003
  Contacts:
    columns:
      contact_id: number
      customer_id: number
      gender: text
      first_name: text
      last_name: text
      contact_phone: text
    primary_key: &id004
    - contact_id
    grain: *id004
  Customer_Address_History:
    columns:
      customer_id: number
      address_id: number
      date_from: time
      date_to: time
    primary_key: []
    grain:
    - customer_id
    observed_non_unique:
    - - address_id
    - - customer_id
    foreign_keys:
    - columns:
      - address_id
      references:
        table: Addresses
        columns:
        - address_id
      many_allowed: true
    - columns:
      - customer_id
      references:
        table: Customers
        columns:
        - customer_id
      many_allowed: true
  Customer_Orders:
    columns:
      order_id: number
      customer_id: number
      order_date: time
      order_status_code: text
    primary_key: &id005
    - order_id
    grain: *id005
    observed_non_unique:
    - - customer_id
    foreign_keys:
    - columns:
      - customer_id
      references:
        table: Customers
        columns:
        - customer_id
      many_allowed: true
  Order_Items:
    columns:
      order_item_id: number
      order_id: number
      product_id: number
      order_quantity: text
    primary_key: []
    grain:
    - order_item_id
    observed_non_unique:
    - - order_id
    - - product_id
    foreign_keys:
    - columns:
      - order_id
      references:
        table: Customer_Orders
        columns:
        - order_id
      many_allowed: true
    - columns:
      - product_id
      references:
        table: Products
        columns:
        - product_id
      many_allowed: true
