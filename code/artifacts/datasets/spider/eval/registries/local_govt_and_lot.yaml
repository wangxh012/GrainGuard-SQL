tables:
  Customers:
    columns:
      customer_id: number
      customer_details: text
    primary_key: &id001
    - customer_id
    grain: *id001
  Properties:
    columns:
      property_id: number
      property_type_code: text
      property_address: text
      other_details: text
    primary_key: &id002
    - property_id
    grain: *id002
  Residents:
    columns:
      resident_id: number
      property_id: number
      date_moved_in: time
      date_moved_out: time
      other_details: text
    primary_key: &id003
    - resident_id
    - property_id
    - date_moved_in
    grain: *id003
    observed_non_unique:
    - - property_id
    foreign_keys:
    - columns:
      - property_id
      references:
        table: Properties
        columns:
        - property_id
      many_allowed: true
  Organizations:
