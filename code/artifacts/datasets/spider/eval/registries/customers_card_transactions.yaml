tables:
  Accounts:
    columns:
      account_id: number
      customer_id: number
      account_name: text
      other_account_details: text
    primary_key: &id001
    - account_id
    grain: *id001
  Customers:
    columns:
      customer_id: number
      customer_first_name: text
      customer_last_name: text
      customer_address: text
      customer_phone: text
      customer_email: text
      other_customer_details: text
    primary_key: &id002
    - customer_id
    grain: *id002
  Customers_Cards:
    columns:
      card_id: number
      customer_id: number
      card_type_code: text
      card_number: text
      date_valid_from: time
      date_valid_to: time
      other_card_details: text
    primary_key: &id003
    - card_id
    grain: *id003
  Financial_Transactions:
    columns:
      transaction_id: number
      previous_transaction_id: number
      account_id: number
      card_id: number
      transaction_type: text
      transaction_date: time
      transaction_amount: number
      transaction_comment: text
      other_transaction_details: text
    primary_key: []
    grain:
    - transaction_id
    observed_non_unique:
    - - account_id
    - - card_id
    foreign_keys:
    - columns:
      - account_id
      references:
        table: Accounts
        columns:
        - account_id
      many_allowed: true
    - columns:
      - card_id
      references:
        table: Customers_Cards
        columns:
        - card_id
      many_allowed: true
