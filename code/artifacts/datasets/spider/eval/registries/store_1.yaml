tables:
  artists:
    columns:
      id: number
      name: text
    primary_key: &id001
    - id
    grain: *id001
  sqlite_sequence:
    columns:
      name: text
      seq: text
    primary_key: []
    grain: []
  albums:
    columns:
      id: number
      title: text
      artist_id: number
    primary_key: &id002
    - id
    grain: *id002
    observed_non_unique:
    - - artist_id
    foreign_keys:
    - columns:
      - artist_id
      references:
        table: artists
        columns:
        - id
      many_allowed: true
  employees:
