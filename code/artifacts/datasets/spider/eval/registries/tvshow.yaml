tables:
  TV_Channel:
    columns:
      id: text
      series_name: text
      Country: text
      Language: text
      Content: text
      Pixel_aspect_ratio_PAR: text
      Hight_definition_TV: text
      Pay_per_view_PPV: text
      Package_Option: text
    primary_key: &id001
    - id
    grain: *id001
  TV_series:
    columns:
      id: number
      Episode: text
      Air_Date: text
      Rating: text
      Share: number
      18_49_Rating_Share: text
      Viewers_m: text
      Weekly_Rank: number
      Channel: text
    primary_key: &id002
    - id
    grain: *id002
    observed_non_unique:
    - - Channel
    foreign_keys:
    - columns:
      - Channel
      references:
        table: TV_Channel
        columns:
        - id
      many_allowed: true
  Cartoon:
    columns:
      id: number
      Title: text
      Directed_by: text
      Written_by: text
      Original_air_date: text
      Production_code: number
      Channel: text
    primary_key: &id003
    - id
    grain: *id003
    observed_non_unique:
    - - Channel
    foreign_keys:
    - columns:
      - Channel
      references:
        table: TV_Channel
        columns:
        - id
      many_allowed: true
