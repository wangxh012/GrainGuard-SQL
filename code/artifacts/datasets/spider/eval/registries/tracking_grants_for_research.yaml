tables:
  Document_Types:
    columns:
      document_type_code: text
      document_description: text
    primary_key: &id001
    - document_type_code
    grain: *id001
  Documents:
    columns:
      document_id: number
      document_type_code: text
      grant_id: number
      sent_date: time
      response_received_date: time
      other_details: text
    primary_key: &id002
    - document_id
    grain: *id002
    observed_non_unique:
    - - grant_id
    - - document_type_code
    foreign_keys:
    - columns:
      - grant_id
      references:
        table: Grants
        columns:
        - grant_id
      many_allowed: true
    - columns:
      - document_type_code
      references:
        table: Document_Types
        columns:
        - document_type_code
      many_allowed: true
  Grants:
    columns:
      grant_id: number
      organisation_id: number
      grant_amount: number
      grant_start_date: time
      grant_end_date: time
      other_details: text
    primary_key: &id003
    - grant_id
    grain: *id003
    observed_non_unique:
    - - organisation_id
    foreign_keys:
    - columns:
      - organisation_id
      references:
        table: Organisations
        columns:
        - organisation_id
      many_allowed: true
  Organisation_Types:
    columns:
      organisation_type: text
      organisation_type_description: text
    primary_key: &id004
    - organisation_type
    grain: *id004
  Organisations:
    columns:
      organisation_id: number
      organisation_type: text
      organisation_details: text
    primary_key: &id005
    - organisation_id
    grain: *id005
    observed_non_unique:
    - - organisation_type
    foreign_keys:
    - columns:
      - organisation_type
      references:
        table: Organisation_Types
        columns:
        - organisation_type
      many_allowed: true
  Project_Outcomes:
    columns:
      project_id: number
      outcome_code: text
      outcome_details: text
    primary_key: []
    grain:
    - project_id
    observed_non_unique:
    - - outcome_code
    - - project_id
    foreign_keys:
    - columns:
      - outcome_code
      references:
        table: Research_Outcomes
        columns:
        - outcome_code
      many_allowed: true
    - columns:
      - project_id
      references:
        table: Projects
        columns:
        - project_id
      many_allowed: true
  Project_Staff:
    columns:
      staff_id: number
      project_id: number
      role_code: text
      date_from: time
      date_to: time
      other_details: text
    primary_key: &id006
    - staff_id
    grain: *id006
    observed_non_unique:
    - - role_code
    - - project_id
    foreign_keys:
    - columns:
      - role_code
      references:
        table: Staff_Roles
        columns:
        - role_code
      many_allowed: true
    - columns:
      - project_id
      references:
        table: Projects
        columns:
        - project_id
      many_allowed: true
  Projects:
    columns:
      project_id: number
      organisation_id: number
      project_details: text
    primary_key: &id007
    - project_id
    grain: *id007
    observed_non_unique:
    - - organisation_id
    foreign_keys:
    - columns:
      - organisation_id
      references:
        table: Organisations
        columns:
        - organisation_id
      many_allowed: true
  Research_Outcomes:
    columns:
      outcome_code: text
      outcome_description: text
    primary_key: &id008
    - outcome_code
    grain: *id008
  Research_Staff:
    columns:
      staff_id: number
      employer_organisation_id: number
      staff_details: text
    primary_key: &id009
    - staff_id
    grain: *id009
    observed_non_unique:
    - - employer_organisation_id
    foreign_keys:
    - columns:
      - employer_organisation_id
      references:
        table: Organisations
        columns:
        - organisation_id
      many_allowed: true
  Staff_Roles:
    columns:
      role_code: text
      role_description: text
    primary_key: &id010
    - role_code
    grain: *id010
  Tasks:
    columns:
      task_id: number
      project_id: number
      task_details: text
      eg Agree Objectives: text
    primary_key: &id011
    - task_id
    grain: *id011
    observed_unique:
    - - project_id
    foreign_keys:
    - columns:
      - project_id
      references:
        table: Projects
        columns:
        - project_id
      many_allowed: true
