tables:
  Scientists:
    columns:
      SSN: number
      Name: text
    primary_key: &id001
    - SSN
    grain: *id001
  Projects:
    columns:
      Code: text
      Name: text
      Hours: number
    primary_key: &id002
    - Code
    grain: *id002
  AssignedTo:
    columns:
      Scientist: number
      Project: text
    primary_key: &id003
    - Scientist
    - Project
    grain: *id003
    observed_unique:
    - - Scientist
    observed_non_unique:
    - - Project
    foreign_keys:
    - columns:
      - Project
      references:
        table: Projects
        columns:
        - Code
      many_allowed: true
    - columns:
      - Scientist
      references:
        table: Scientists
        columns:
        - SSN
      many_allowed: true
