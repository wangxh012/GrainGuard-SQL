tables:
  Staff:
    columns:
      staff_id: number
      gender: text
      first_name: text
      last_name: text
      email_address: text
      phone_number: text
    primary_key: &id001
    - staff_id
    grain: *id001
  Customers:
    columns:
      customer_id: number
      customer_type_code: text
      address_line_1: text
      address_line_2: text
      town_city: text
      state: text
      email_address: text
      phone_number: text
    primary_key: &id002
    - customer_id
    grain: *id002
  Products:
    columns:
      product_id: number
      parent_product_id: number
      product_category_code: text
      date_product_first_available: time
      date_product_discontinued: time
      product_name: text
      product_description: text
      product_price: number
    primary_key: &id003
    - product_id
    grain: *id003
  Complaints:
    columns:
      complaint_id: number
      product_id: number
      customer_id: number
      complaint_outcome_code: text
      complaint_status_code: text
      complaint_type_code: text
      date_complaint_raised: time
      date_complaint_closed: time
      staff_id: number
    primary_key: []
    grain:
    - complaint_id
    observed_non_unique:
    - - customer_id
    - - product_id
    - - staff_id
    foreign_keys:
    - columns:
      - customer_id
      references:
        table: Customers
        columns:
        - customer_id
      many_allowed: true
    - columns:
      - product_id
      references:
        table: Products
        columns:
        - product_id
      many_allowed: true
    - columns:
      - staff_id
      references:
        table: Staff
        columns:
        - staff_id
      many_allowed: true
