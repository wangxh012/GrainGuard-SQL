tables:
  Ref_Address_Types:
    columns:
      address_type_code: text
      address_type_description: text
    primary_key: &id001
    - address_type_code
    grain: *id001
  Ref_Detention_Type:
    columns:
      detention_type_code: text
      detention_type_description: text
    primary_key: &id002
    - detention_type_code
    grain: *id002
  Ref_Incident_Type:
    columns:
      incident_type_code: text
      incident_type_description: text
    primary_key: &id003
    - incident_type_code
    grain: *id003
  Addresses:
    columns:
      address_id: number
      line_1: text
      line_2: text
      line_3: text
      city: text
      zip_postcode: text
      state_province_county: text
      country: text
      other_address_details: text
    primary_key: &id004
    - address_id
    grain: *id004
  Students:
    columns:
      student_id: number
      address_id: number
      first_name: text
      middle_name: text
      last_name: text
      cell_mobile_number: text
      email_address: text
      date_first_rental: time
      date_left_university: time
      other_student_details: text
    primary_key: &id005
    - student_id
    grain: *id005
    observed_non_unique:
    - - address_id
    foreign_keys:
    - columns:
      - address_id
      references:
        table: Addresses
        columns:
        - address_id
      many_allowed: true
  Teachers:
    columns:
      teacher_id: number
      address_id: number
      first_name: text
      middle_name: text
      last_name: text
      gender: text
      cell_mobile_number: text
      email_address: text
      other_details: text
    primary_key: &id006
    - teacher_id
    grain: *id006
    observed_non_unique:
    - - address_id
    foreign_keys:
    - columns:
      - address_id
      references:
        table: Addresses
        columns:
        - address_id
      many_allowed: true
  Assessment_Notes:
    columns:
      notes_id: number
      student_id: number
      teacher_id: number
      date_of_notes: time
      text_of_notes: text
      other_details: text
    primary_key: []
    grain:
    - notes_id
    observed_non_unique:
    - - teacher_id
    - - student_id
    foreign_keys:
    - columns:
      - teacher_id
      references:
        table: Teachers
        columns:
        - teacher_id
      many_allowed: true
    - columns:
      - student_id
      references:
        table: Students
        columns:
        - student_id
      many_allowed: true
  Behavior_Incident:
    columns:
      incident_id: number
      incident_type_code: text
      student_id: number
      date_incident_start: time
      date_incident_end: time
      incident_summary: text
      recommendations: text
      other_details: text
    primary_key: &id007
    - incident_id
    grain: *id007
    observed_non_unique:
    - - student_id
    - - incident_type_code
    foreign_keys:
    - columns:
      - student_id
      references:
        table: Students
        columns:
        - student_id
      many_allowed: true
    - columns:
      - incident_type_code
      references:
        table: Ref_Incident_Type
        columns:
        - incident_type_code
      many_allowed: true
  Detention:
    columns:
      detention_id: number
      detention_type_code: text
      teacher_id: number
      datetime_detention_start: time
      datetime_detention_end: time
      detention_summary: text
      other_details: text
    primary_key: &id008
    - detention_id
    grain: *id008
    observed_non_unique:
    - - teacher_id
    - - detention_type_code
    foreign_keys:
    - columns:
      - teacher_id
      references:
        table: Teachers
        columns:
        - teacher_id
      many_allowed: true
    - columns:
      - detention_type_code
      references:
        table: Ref_Detention_Type
        columns:
        - detention_type_code
      many_allowed: true
  Student_Addresses:
    columns:
      student_id: number
      address_id: number
      date_address_from: time
      date_address_to: time
      monthly_rental: number
      other_details: text
    primary_key: []
    grain:
    - student_id
    observed_non_unique:
    - - student_id
    - - address_id
    foreign_keys:
    - columns:
      - student_id
      references:
        table: Students
        columns:
        - student_id
      many_allowed: true
    - columns:
      - address_id
      references:
        table: Addresses
        columns:
        - address_id
      many_allowed: true
  Students_in_Detention:
    columns:
      student_id: number
      detention_id: number
      incident_id: number
    primary_key: []
    grain:
    - student_id
    observed_non_unique:
    - - student_id
    - - detention_id
    - - incident_id
    foreign_keys:
    - columns:
      - student_id
      references:
        table: Students
        columns:
        - student_id
      many_allowed: true
    - columns:
      - detention_id
      references:
        table: Detention
        columns:
        - detention_id
      many_allowed: true
    - columns:
      - incident_id
      references:
        table: Behavior_Incident
        columns:
        - incident_id
      many_allowed: true
