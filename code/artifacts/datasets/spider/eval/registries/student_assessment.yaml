tables:
  Addresses:
    columns:
      address_id: number
      line_1: text
      line_2: text
      city: text
      zip_postcode: text
      state_province_county: text
      country: text
    primary_key: &id001
    - address_id
    grain: *id001
  People:
    columns:
      person_id: number
      first_name: text
      middle_name: text
      last_name: text
      cell_mobile_number: text
      email_address: text
      login_name: text
      password: text
    primary_key: &id002
    - person_id
    grain: *id002
  Students:
    columns:
      student_id: number
      student_details: text
    primary_key: &id003
    - student_id
    grain: *id003
    foreign_keys:
    - columns:
      - student_id
      references:
        table: People
        columns:
        - person_id
      many_allowed: true
  Courses:
    columns:
      course_id: text
      course_name: text
      course_description: text
      other_details: text
    primary_key: &id004
    - course_id
    grain: *id004
  People_Addresses:
    columns:
      person_address_id: number
      person_id: number
      address_id: number
      date_from: time
      date_to: time
    primary_key: &id005
    - person_address_id
    grain: *id005
    observed_unique:
    - - address_id
    - - person_id
    foreign_keys:
    - columns:
      - address_id
      references:
        table: Addresses
        columns:
        - address_id
      many_allowed: true
    - columns:
      - person_id
      references:
        table: People
        columns:
        - person_id
      many_allowed: true
  Student_Course_Registrations:
    columns:
      student_id: number
      course_id: number
      registration_date: time
    primary_key: &id006
    - student_id
    - course_id
    grain: *id006
    observed_non_unique:
    - - course_id
    - - student_id
    foreign_keys:
    - columns:
      - course_id
      references:
        table: Courses
        columns:
        - course_id
      many_allowed: true
    - columns:
      - student_id
      references:
        table: Students
        columns:
        - student_id
      many_allowed: true
  Student_Course_Attendance:
    columns:
      student_id: number
      course_id: number
      date_of_attendance: time
    primary_key: &id007
    - student_id
    - course_id
    grain: *id007
    observed_non_unique:
    - - student_id
    - - course_id
    foreign_keys:
    - columns:
      - student_id
      references:
        table: Student_Course_Registrations
        columns:
        - student_id
      many_allowed: true
    - columns:
      - course_id
      references:
        table: Student_Course_Registrations
        columns:
        - course_id
      many_allowed: true
  Candidates:
    columns:
      candidate_id: number
      candidate_details: text
    primary_key: &id008
    - candidate_id
    grain: *id008
    foreign_keys:
    - columns:
      - candidate_id
      references:
        table: People
        columns:
        - person_id
      many_allowed: true
  Candidate_Assessments:
    columns:
      candidate_id: number
      qualification: text
      assessment_date: time
      asessment_outcome_code: text
    primary_key: &id009
    - candidate_id
    - qualification
    grain: *id009
    observed_unique:
    - - candidate_id
    foreign_keys:
    - columns:
      - candidate_id
      references:
        table: Candidates
        columns:
        - candidate_id
      many_allowed: true
