tables:
  entrepreneur:
    columns:
      Entrepreneur_ID: number
      People_ID: number
      Company: text
      Money_Requested: number
      Investor: text
    primary_key: &id001
    - Entrepreneur_ID
    grain: *id001
    observed_unique:
    - - People_ID
    foreign_keys:
    - columns:
      - People_ID
      references:
        table: people
        columns:
        - People_ID
      many_allowed: true
  people:
    columns:
      People_ID: number
      Name: text
      Height: number
      Weight: number
      Date_of_Birth: text
    primary_key: &id002
    - People_ID
    grain: *id002
