tables:
  Third_Party_Companies:
    columns:
      company_id: number
      company_type: text
      company_name: text
      company_address: text
      other_company_details: text
    primary_key: &id001
    - company_id
    grain: *id001
  Maintenance_Contracts:
    columns:
      maintenance_contract_id: number
      maintenance_contract_company_id: number
      contract_start_date: time
      contract_end_date: time
      other_contract_details: text
    primary_key: &id002
    - maintenance_contract_id
    grain: *id002
    observed_non_unique:
    - - maintenance_contract_company_id
    foreign_keys:
    - columns:
      - maintenance_contract_company_id
      references:
        table: Third_Party_Companies
        columns:
        - company_id
      many_allowed: true
  Parts:
    columns:
      part_id: number
      part_name: text
      chargeable_yn: text
      chargeable_amount: text
      other_part_details: text
    primary_key: &id003
    - part_id
    grain: *id003
  Skills:
    columns:
      skill_id: number
      skill_code: text
      skill_description: text
    primary_key: &id004
    - skill_id
    grain: *id004
  Staff:
    columns:
      staff_id: number
      staff_name: text
      gender: text
      other_staff_details: text
    primary_key: &id005
    - staff_id
    grain: *id005
  Assets:
    columns:
      asset_id: number
      maintenance_contract_id: number
      supplier_company_id: number
      asset_details: text
      asset_make: text
      asset_model: text
      asset_acquired_date: time
      asset_disposed_date: time
      other_asset_details: text
    primary_key: &id006
    - asset_id
    grain: *id006
    observed_non_unique:
    - - supplier_company_id
    - - maintenance_contract_id
    foreign_keys:
    - columns:
      - supplier_company_id
      references:
        table: Third_Party_Companies
        columns:
        - company_id
      many_allowed: true
    - columns:
      - maintenance_contract_id
      references:
        table: Maintenance_Contracts
        columns:
        - maintenance_contract_id
      many_allowed: true
  Asset_Parts:
    columns:
      asset_id: number
      part_id: number
    primary_key: []
    grain:
    - asset_id
    observed_non_unique:
    - - asset_id
    - - part_id
    foreign_keys:
    - columns:
      - asset_id
      references:
        table: Assets
        columns:
        - asset_id
      many_allowed: true
    - columns:
      - part_id
      references:
        table: Parts
        columns:
        - part_id
      many_allowed: true
  Maintenance_Engineers:
    columns:
      engineer_id: number
      company_id: number
      first_name: text
      last_name: text
      other_details: text
    primary_key: &id007
    - engineer_id
    grain: *id007
    observed_non_unique:
    - - company_id
    foreign_keys:
    - columns:
      - company_id
      references:
        table: Third_Party_Companies
        columns:
        - company_id
      many_allowed: true
  Engineer_Skills:
    columns:
      engineer_id: number
      skill_id: number
    primary_key: []
    grain:
    - engineer_id
    observed_non_unique:
    - - skill_id
    - - engineer_id
    foreign_keys:
    - columns:
      - skill_id
      references:
        table: Skills
        columns:
        - skill_id
      many_allowed: true
    - columns:
      - engineer_id
      references:
        table: Maintenance_Engineers
        columns:
        - engineer_id
      many_allowed: true
  Fault_Log:
    columns:
      fault_log_entry_id: number
      asset_id: number
      recorded_by_staff_id: number
      fault_log_entry_datetime: time
      fault_description: text
      other_fault_details: text
    primary_key: &id008
    - fault_log_entry_id
    grain: *id008
    observed_non_unique:
    - - recorded_by_staff_id
    - - asset_id
    foreign_keys:
    - columns:
      - recorded_by_staff_id
      references:
        table: Staff
        columns:
        - staff_id
      many_allowed: true
    - columns:
      - asset_id
      references:
        table: Assets
        columns:
        - asset_id
      many_allowed: true
  Engineer_Visits:
    columns:
      engineer_visit_id: number
      contact_staff_id: number
      engineer_id: number
      fault_log_entry_id: number
      fault_status: text
      visit_start_datetime: time
      visit_end_datetime: time
      other_visit_details: text
    primary_key: &id009
    - engineer_visit_id
    grain: *id009
    observed_non_unique:
    - - contact_staff_id
    - - engineer_id
    - - fault_log_entry_id
    foreign_keys:
    - columns:
      - contact_staff_id
      references:
        table: Staff
        columns:
        - staff_id
      many_allowed: true
    - columns:
      - engineer_id
      references:
        table: Maintenance_Engineers
        columns:
        - engineer_id
      many_allowed: true
    - columns:
      - fault_log_entry_id
      references:
        table: Fault_Log
        columns:
        - fault_log_entry_id
      many_allowed: true
  Part_Faults:
    columns:
      part_fault_id: number
      part_id: number
      fault_short_name: text
      fault_description: text
      other_fault_details: text
    primary_key: &id010
    - part_fault_id
    grain: *id010
    observed_non_unique:
    - - part_id
    foreign_keys:
    - columns:
      - part_id
      references:
        table: Parts
        columns:
        - part_id
      many_allowed: true
  Fault_Log_Parts:
    columns:
      fault_log_entry_id: number
      part_fault_id: number
      fault_status: text
    primary_key: []
    grain:
    - fault_log_entry_id
    observed_non_unique:
    - - fault_log_entry_id
    - - part_fault_id
    foreign_keys:
    - columns:
      - fault_log_entry_id
      references:
        table: Fault_Log
        columns:
        - fault_log_entry_id
      many_allowed: true
    - columns:
      - part_fault_id
      references:
        table: Part_Faults
        columns:
        - part_fault_id
      many_allowed: true
  Skills_Required_To_Fix:
    columns:
      part_fault_id: number
      skill_id: number
    primary_key: []
    grain:
    - part_fault_id
    observed_non_unique:
    - - skill_id
    - - part_fault_id
    foreign_keys:
    - columns:
      - skill_id
      references:
        table: Skills
        columns:
        - skill_id
      many_allowed: true
    - columns:
      - part_fault_id
      references:
        table: Part_Faults
        columns:
        - part_fault_id
      many_allowed: true
