tables:
  mountain:
    columns:
      id: number
      name: text
      Height: number
      Prominence: number
      Range: text
      Country: text
    primary_key: &id001
    - id
    grain: *id001
  camera_lens:
    columns:
      id: number
      brand: text
      name: text
      focal_length_mm: number
      max_aperture: number
    primary_key: &id002
    - id
    grain: *id002
  photos:
    columns:
      id: number
      camera_lens_id: number
      mountain_id: number
      color: text
      name: text
    primary_key: &id003
    - id
    grain: *id003
    observed_non_unique:
    - - mountain_id
    - - camera_lens_id
    foreign_keys:
    - columns:
      - mountain_id
      references:
        table: mountain
        columns:
        - id
      many_allowed: true
    - columns:
      - camera_lens_id
      references:
        table: camera_lens
        columns:
        - id
      many_allowed: true
