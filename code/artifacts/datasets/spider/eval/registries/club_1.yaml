tables:
  Student:
    columns:
      StuID: number
      LName: text
      Fname: text
      Age: number
      Sex: text
      Major: number
      Advisor: number
      city_code: text
    primary_key: &id001
    - StuID
    grain: *id001
  Club:
    columns:
      ClubID: number
      ClubName: text
      ClubDesc: text
      ClubLocation: text
    primary_key: &id002
    - ClubID
    grain: *id002
  Member_of_club:
    columns:
      StuID: number
      ClubID: number
      Position: text
    primary_key: []
    grain:
    - StuID
    observed_unique:
    - - StuID
    observed_non_unique:
    - - ClubID
    foreign_keys:
    - columns:
      - ClubID
      references:
        table: Club
        columns:
        - ClubID
      many_allowed: true
    - columns:
      - StuID
      references:
        table: Student
        columns:
        - StuID
      many_allowed: true
