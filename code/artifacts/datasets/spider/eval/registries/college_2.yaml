tables:
  classroom:
    columns:
      building: text
      room_number: text
      capacity: number
    primary_key: &id001
    - building
    - room_number
    grain: *id001
  department:
    columns:
      dept_name: text
      building: text
      budget: number
    primary_key: &id002
    - dept_name
    grain: *id002
  course:
    columns:
      course_id: text
      title: text
      dept_name: text
      credits: number
    primary_key: &id003
    - course_id
    grain: *id003
    observed_non_unique:
    - - dept_name
    foreign_keys:
    - columns:
      - dept_name
      references:
        table: department
        columns:
        - dept_name
      many_allowed: true
  instructor:
    columns:
      ID: text
      name: text
      dept_name: text
      salary: number
    primary_key: &id004
    - ID
    grain: *id004
    observed_non_unique:
    - - dept_name
    foreign_keys:
    - columns:
      - dept_name
      references:
        table: department
        columns:
        - dept_name
      many_allowed: true
  section:
    columns:
      course_id: text
      sec_id: text
      semester: text
      year: number
      building: text
      room_number: text
      time_slot_id: text
    primary_key: &id005
    - course_id
    - sec_id
    - semester
    - year
    grain: *id005
    observed_non_unique:
    - - building
    - - room_number
    - - course_id
    foreign_keys:
    - columns:
      - building
      references:
        table: classroom
        columns:
        - building
      many_allowed: true
    - columns:
      - room_number
      references:
        table: classroom
        columns:
        - room_number
      many_allowed: true
    - columns:
      - course_id
      references:
        table: course
        columns:
        - course_id
      many_allowed: true
  teaches:
