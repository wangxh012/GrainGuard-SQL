        columns:
        - ID
      many_allowed: true
    - columns:
      - course_id
      references:
        table: section
        columns:
        - course_id
      many_allowed: true
    - columns:
      - sec_id
      references:
        table: section
        columns:
        - sec_id
      many_allowed: true
    - columns:
      - semester
      references:
        table: section
        columns:
        - semester
      many_allowed: true
    - columns:
