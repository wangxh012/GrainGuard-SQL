tables:
  Addresses:
    columns:
      address_id: number
      line_1_number_building: text
      town_city: text
      zip_postcode: text
      state_province_county: text
      country: text
    primary_key: &id001
    - address_id
    grain: *id001
  Services:
    columns:
      service_id: number
      service_type_code: text
      service_name: text
      service_descriptio: text
    primary_key: &id002
    - service_id
    grain: *id002
  Forms:
    columns:
      form_id: number
      form_type_code: text
      service_id: number
      form_number: text
      form_name: text
      form_description: text
    primary_key: &id003
    - form_id
    grain: *id003
    observed_unique:
    - - service_id
    foreign_keys:
    - columns:
      - service_id
      references:
        table: Services
        columns:
        - service_id
      many_allowed: true
  Individuals:
    columns:
      individual_id: number
      individual_first_name: text
      individual_middle_name: text
      inidividual_phone: text
      individual_email: text
      individual_address: text
      individual_last_name: text
    primary_key: &id004
    - individual_id
    grain: *id004
  Organizations:
    columns:
      organization_id: number
      date_formed: time
      organization_name: text
      uk_vat_number: text
    primary_key: &id005
    - organization_id
    grain: *id005
  Parties:
    columns:
      party_id: number
      payment_method_code: text
      party_phone: text
      party_email: text
    primary_key: &id006
    - party_id
    grain: *id006
  Organization_Contact_Individuals:
    columns:
      individual_id: number
      organization_id: number
      date_contact_from: time
      date_contact_to: time
    primary_key: &id007
    - individual_id
    - organization_id
    grain: *id007
    observed_non_unique:
    - - individual_id
    - - organization_id
    foreign_keys:
    - columns:
      - individual_id
      references:
        table: Individuals
        columns:
        - individual_id
      many_allowed: true
    - columns:
      - organization_id
      references:
        table: Organizations
        columns:
        - organization_id
      many_allowed: true
  Party_Addresses:
    columns:
      party_id: number
      address_id: number
      date_address_from: time
      address_type_code: text
      date_address_to: time
    primary_key: &id008
    - party_id
    - address_id
    grain: *id008
    observed_non_unique:
    - - party_id
    - - address_id
    foreign_keys:
    - columns:
      - party_id
      references:
        table: Parties
        columns:
        - party_id
      many_allowed: true
    - columns:
      - address_id
      references:
        table: Addresses
        columns:
        - address_id
      many_allowed: true
  Party_Forms:
    columns:
      party_id: number
      form_id: number
      date_completion_started: time
      form_status_code: text
      date_fully_completed: time
    primary_key: &id009
    - party_id
    - form_id
    grain: *id009
    observed_non_unique:
    - - form_id
    - - party_id
    foreign_keys:
    - columns:
      - form_id
      references:
        table: Forms
        columns:
        - form_id
      many_allowed: true
    - columns:
      - party_id
      references:
        table: Parties
        columns:
        - party_id
      many_allowed: true
  Party_Services:
    columns:
      booking_id: number
      customer_id: number
      service_id: number
      service_datetime: time
      booking_made_date: time
    primary_key: []
    grain:
    - booking_id
    observed_non_unique:
    - - customer_id
    - - service_id
    foreign_keys:
    - columns:
      - customer_id
      references:
        table: Parties
        columns:
        - party_id
      many_allowed: true
    - columns:
      - service_id
      references:
        table: Services
        columns:
        - service_id
      many_allowed: true
