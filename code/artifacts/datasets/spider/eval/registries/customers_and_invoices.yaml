tables:
  Customers:
    columns:
      customer_id: number
      customer_first_name: text
      customer_middle_initial: text
      customer_last_name: text
      gender: text
      email_address: text
      login_name: text
      login_password: text
      phone_number: text
      town_city: text
      state_county_province: text
      country: text
    primary_key: &id001
    - customer_id
    grain: *id001
  Orders:
    columns:
      order_id: number
      customer_id: number
      date_order_placed: time
      order_details: text
    primary_key: &id002
    - order_id
    grain: *id002
    observed_non_unique:
    - - customer_id
    foreign_keys:
    - columns:
      - customer_id
      references:
        table: Customers
        columns:
        - customer_id
      many_allowed: true
  Invoices:
    columns:
      invoice_number: number
      order_id: number
      invoice_date: time
    primary_key: &id003
    - invoice_number
    grain: *id003
    observed_non_unique:
    - - order_id
    foreign_keys:
    - columns:
      - order_id
      references:
        table: Orders
        columns:
        - order_id
      many_allowed: true
  Accounts:
    columns:
      account_id: number
      customer_id: number
      date_account_opened: time
      account_name: text
      other_account_details: text
    primary_key: &id004
    - account_id
    grain: *id004
    observed_non_unique:
    - - customer_id
    foreign_keys:
    - columns:
      - customer_id
      references:
        table: Customers
        columns:
        - customer_id
      many_allowed: true
  Product_Categories:
    columns:
      production_type_code: text
      product_type_description: text
      vat_rating: number
    primary_key: &id005
    - production_type_code
    grain: *id005
  Products:
    columns:
      product_id: number
      parent_product_id: number
      production_type_code: text
      unit_price: number
      product_name: text
      product_color: text
      product_size: text
    primary_key: &id006
    - product_id
    grain: *id006
    observed_non_unique:
    - - production_type_code
    foreign_keys:
    - columns:
      - production_type_code
      references:
        table: Product_Categories
        columns:
        - production_type_code
      many_allowed: true
  Financial_Transactions:
    columns:
      transaction_id: number
      account_id: number
      invoice_number: number
      transaction_type: text
      transaction_date: time
      transaction_amount: number
      transaction_comment: text
      other_transaction_details: text
    primary_key: []
    grain:
    - transaction_id
    observed_non_unique:
    - - account_id
    - - invoice_number
    foreign_keys:
    - columns:
      - account_id
      references:
        table: Accounts
        columns:
        - account_id
      many_allowed: true
    - columns:
      - invoice_number
      references:
        table: Invoices
        columns:
        - invoice_number
      many_allowed: true
  Order_Items:
    columns:
      order_item_id: number
      order_id: number
      product_id: number
      product_quantity: text
      other_order_item_details: text
    primary_key: &id007
    - order_item_id
    grain: *id007
    observed_non_unique:
    - - order_id
    - - product_id
    foreign_keys:
    - columns:
      - order_id
      references:
        table: Orders
        columns:
        - order_id
      many_allowed: true
    - columns:
      - product_id
      references:
        table: Products
        columns:
        - product_id
      many_allowed: true
  Invoice_Line_Items:
    columns:
      order_item_id: number
      invoice_number: number
      product_id: number
      product_title: text
      product_quantity: text
      product_price: number
      derived_product_cost: number
      derived_vat_payable: number
      derived_total_cost: number
    primary_key: []
    grain:
    - order_item_id
    observed_non_unique:
    - - product_id
    - - invoice_number
    - - order_item_id
    foreign_keys:
    - columns:
      - product_id
      references:
        table: Products
        columns:
        - product_id
      many_allowed: true
    - columns:
      - invoice_number
      references:
        table: Invoices
        columns:
        - invoice_number
      many_allowed: true
    - columns:
      - order_item_id
      references:
        table: Order_Items
        columns:
        - order_item_id
      many_allowed: true
