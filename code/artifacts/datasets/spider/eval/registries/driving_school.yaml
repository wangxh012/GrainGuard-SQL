tables:
  Addresses:
    columns:
      address_id: number
      line_1_number_building: text
      city: text
      zip_postcode: text
      state_province_county: text
      country: text
    primary_key: &id001
    - address_id
    grain: *id001
  Staff:
    columns:
      staff_id: number
      staff_address_id: number
      nickname: text
      first_name: text
      middle_name: text
      last_name: text
      date_of_birth: time
      date_joined_staff: time
      date_left_staff: time
    primary_key: &id002
    - staff_id
    grain: *id002
    observed_non_unique:
    - - staff_address_id
    foreign_keys:
    - columns:
      - staff_address_id
      references:
        table: Addresses
        columns:
        - address_id
      many_allowed: true
  Vehicles:
    columns:
      vehicle_id: number
      vehicle_details: text
    primary_key: &id003
    - vehicle_id
    grain: *id003
  Customers:
    columns:
      customer_id: number
      customer_address_id: number
      customer_status_code: text
      date_became_customer: time
      date_of_birth: time
      first_name: text
      last_name: text
      amount_outstanding: number
      email_address: text
      phone_number: text
      cell_mobile_phone_number: text
    primary_key: &id004
    - customer_id
    grain: *id004
    observed_non_unique:
    - - customer_address_id
    foreign_keys:
    - columns:
      - customer_address_id
      references:
        table: Addresses
        columns:
        - address_id
      many_allowed: true
  Customer_Payments:
    columns:
      customer_id: number
      datetime_payment: time
      payment_method_code: text
      amount_payment: number
    primary_key: &id005
    - customer_id
    - datetime_payment
    grain: *id005
    observed_non_unique:
    - - customer_id
    foreign_keys:
    - columns:
      - customer_id
      references:
        table: Customers
        columns:
        - customer_id
      many_allowed: true
  Lessons:
    columns:
      lesson_id: number
      customer_id: number
      lesson_status_code: text
      staff_id: number
      vehicle_id: number
      lesson_date: time
      lesson_time: text
      price: number
    primary_key: &id006
    - lesson_id
    grain: *id006
    observed_non_unique:
    - - customer_id
    - - staff_id
    - - vehicle_id
    foreign_keys:
    - columns:
      - customer_id
      references:
        table: Customers
        columns:
        - customer_id
      many_allowed: true
    - columns:
      - staff_id
      references:
        table: Staff
        columns:
        - staff_id
      many_allowed: true
    - columns:
      - vehicle_id
      references:
        table: Vehicles
        columns:
        - vehicle_id
      many_allowed: true
