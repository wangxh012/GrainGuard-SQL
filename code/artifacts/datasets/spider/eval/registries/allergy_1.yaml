tables:
  Allergy_Type:
    columns:
      Allergy: text
      AllergyType: text
    primary_key: &id001
    - Allergy
    grain: *id001
  Has_Allergy:
    columns:
      StuID: number
      Allergy: text
    primary_key: []
    grain:
    - StuID
    observed_non_unique:
    - - Allergy
    - - StuID
    foreign_keys:
    - columns:
      - Allergy
      references:
        table: Allergy_Type
        columns:
        - Allergy
      many_allowed: true
    - columns:
      - StuID
      references:
        table: Student
        columns:
        - StuID
      many_allowed: true
  Student:
    columns:
      StuID: number
      LName: text
      Fname: text
      Age: number
      Sex: text
      Major: number
      Advisor: number
      city_code: text
    primary_key: &id002
    - StuID
    grain: *id002
