tables:
  Student:
    columns:
      StuID: number
      LName: text
      Fname: text
      Age: number
      Sex: text
      Major: number
      Advisor: number
      city_code: text
    primary_key: &id001
    - StuID
    grain: *id001
  Dorm:
    columns:
      dormid: number
      dorm_name: text
      student_capacity: number
      gender: text
    primary_key: []
    grain:
    - dormid
  Dorm_amenity:
    columns:
      amenid: number
      amenity_name: text
    primary_key: []
    grain:
    - amenid
  Has_amenity:
    columns:
      dormid: number
      amenid: number
    primary_key: []
    grain:
    - dormid
    observed_non_unique:
    - - amenid
    - - dormid
    foreign_keys:
    - columns:
      - amenid
      references:
        table: Dorm_amenity
        columns:
        - amenid
      many_allowed: true
    - columns:
      - dormid
      references:
        table: Dorm
        columns:
        - dormid
      many_allowed: true
  Lives_in:
    columns:
      stuid: number
      dormid: number
      room_number: number
    primary_key: []
    grain:
    - stuid
    observed_unique:
    - - stuid
    observed_non_unique:
    - - dormid
    foreign_keys:
    - columns:
      - dormid
      references:
        table: Dorm
        columns:
        - dormid
      many_allowed: true
    - columns:
      - stuid
      references:
        table: Student
        columns:
        - StuID
      many_allowed: true
