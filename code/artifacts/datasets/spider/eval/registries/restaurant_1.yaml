tables:
  Student:
    columns:
      StuID: number
      LName: text
      Fname: text
      Age: number
      Sex: text
      Major: number
      Advisor: number
      city_code: text
    primary_key: &id001
    - StuID
    grain: *id001
  Restaurant:
    columns:
      ResID: number
      ResName: text
      Address: text
      Rating: number
    primary_key: &id002
    - ResID
    grain: *id002
  Type_Of_Restaurant:
    columns:
      ResID: number
      ResTypeID: number
    primary_key: []
    grain:
    - ResID
    observed_unique:
    - - ResTypeID
    - - ResID
    foreign_keys:
    - columns:
      - ResTypeID
      references:
        table: Restaurant_Type
        columns:
        - ResTypeID
      many_allowed: true
    - columns:
      - ResID
      references:
        table: Restaurant
        columns:
        - ResID
      many_allowed: true
  Restaurant_Type:
    columns:
      ResTypeID: number
      ResTypeName: text
      ResTypeDescription: text
    primary_key: &id003
    - ResTypeID
    grain: *id003
  Visits_Restaurant:
    columns:
      StuID: number
      ResID: number
      Time: time
      Spent: number
    primary_key: []
    grain:
    - StuID
    observed_unique:
    - - ResID
    - - StuID
    foreign_keys:
    - columns:
      - ResID
      references:
        table: Restaurant
        columns:
        - ResID
      many_allowed: true
    - columns:
      - StuID
      references:
        table: Student
        columns:
        - StuID
      many_allowed: true
