tables:
  station:
    columns:
      id: number
      name: text
      lat: number
      long: number
      dock_count: number
      city: text
      installation_date: text
    primary_key: &id001
    - id
    grain: *id001
  status:
    columns:
      station_id: number
      bikes_available: number
      docks_available: number
      time: text
    primary_key: []
    grain:
    - station_id
    observed_non_unique:
    - - station_id
    foreign_keys:
    - columns:
      - station_id
      references:
        table: station
        columns:
        - id
      many_allowed: true
  trip:
    columns:
      id: number
      duration: number
      start_date: text
      start_station_name: text
      start_station_id: number
      end_date: text
      end_station_name: text
      end_station_id: number
      bike_id: number
      subscription_type: text
      zip_code: number
    primary_key: &id002
    - id
    grain: *id002
  weather:
    columns:
      date: text
      max_temperature_f: number
      mean_temperature_f: number
      min_temperature_f: number
      max_dew_point_f: number
      mean_dew_point_f: number
      min_dew_point_f: number
      max_humidity: number
      mean_humidity: number
      min_humidity: number
      max_sea_level_pressure_inches: number
      mean_sea_level_pressure_inches: number
      min_sea_level_pressure_inches: number
      max_visibility_miles: number
      mean_visibility_miles: number
      min_visibility_miles: number
      max_wind_Speed_mph: number
      mean_wind_speed_mph: number
      max_gust_speed_mph: number
      precipitation_inches: number
      cloud_cover: number
      events: text
      wind_dir_degrees: number
      zip_code: number
    primary_key: []
    grain: []
