tables:
  company:
    columns:
      Company_ID: number
      Rank: number
      Company: text
      Headquarters: text
      Main_Industry: text
      Sales_billion: number
      Profits_billion: number
      Assets_billion: number
      Market_Value: number
    primary_key: &id001
    - Company_ID
    grain: *id001
  gas_station:
    columns:
      Station_ID: number
      Open_Year: number
      Location: text
      Manager_Name: text
      Vice_Manager_Name: text
      Representative_Name: text
    primary_key: &id002
    - Station_ID
    grain: *id002
  station_company:
    columns:
      Station_ID: number
      Company_ID: number
      Rank_of_the_Year: number
    primary_key: &id003
    - Station_ID
    - Company_ID
    grain: *id003
    observed_unique:
    - - Station_ID
    observed_non_unique:
    - - Company_ID
    foreign_keys:
    - columns:
      - Company_ID
      references:
        table: company
        columns:
        - Company_ID
      many_allowed: true
    - columns:
      - Station_ID
      references:
        table: gas_station
        columns:
        - Station_ID
      many_allowed: true
