tables:
  business:
    columns:
      bid: number
      business_id: text
      name: text
      full_address: text
      city: text
      latitude: text
      longitude: text
      review_count: number
      is_open: number
      rating: number
      state: text
    primary_key: &id001
    - bid
    grain: *id001
  category:
    columns:
      id: number
      business_id: text
      category_name: text
    primary_key: &id002
    - id
    grain: *id002
    foreign_keys:
    - columns:
      - business_id
      references:
        table: business
        columns:
        - business_id
      many_allowed: true
  user:
    columns:
      uid: number
      user_id: text
      name: text
    primary_key: &id003
    - uid
    grain: *id003
  checkin:
    columns:
      cid: number
      business_id: text
      count: number
      day: text
    primary_key: &id004
    - cid
    grain: *id004
    foreign_keys:
    - columns:
      - business_id
      references:
        table: business
        columns:
        - business_id
      many_allowed: true
  neighbourhood:
    columns:
      id: number
      business_id: text
      neighbourhood_name: text
    primary_key: &id005
    - id
    grain: *id005
    foreign_keys:
    - columns:
      - business_id
      references:
        table: business
        columns:
        - business_id
      many_allowed: true
  review:
    columns:
      rid: number
      business_id: text
      user_id: text
      rating: number
      text: text
      year: number
      month: text
    primary_key: &id006
    - rid
    grain: *id006
    foreign_keys:
    - columns:
      - user_id
      references:
        table: user
        columns:
        - user_id
      many_allowed: true
    - columns:
      - business_id
      references:
        table: business
        columns:
        - business_id
      many_allowed: true
  tip:
    columns:
      tip_id: number
      business_id: text
      text: text
      user_id: text
      likes: number
      year: number
      month: text
    primary_key: &id007
    - tip_id
    grain: *id007
    foreign_keys:
    - columns:
      - user_id
      references:
        table: user
        columns:
        - user_id
      many_allowed: true
    - columns:
      - business_id
      references:
        table: business
        columns:
        - business_id
      many_allowed: true
