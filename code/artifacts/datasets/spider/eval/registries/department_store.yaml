tables:
  Addresses:
    columns:
      address_id: number
      address_details: text
    primary_key: &id001
    - address_id
    grain: *id001
  Staff:
    columns:
      staff_id: number
      staff_gender: text
      staff_name: text
    primary_key: &id002
    - staff_id
    grain: *id002
  Suppliers:
    columns:
      supplier_id: number
      supplier_name: text
      supplier_phone: text
    primary_key: &id003
    - supplier_id
    grain: *id003
  Department_Store_Chain:
    columns:
      dept_store_chain_id: number
      dept_store_chain_name: text
    primary_key: &id004
    - dept_store_chain_id
    grain: *id004
  Customers:
    columns:
      customer_id: number
      payment_method_code: text
      customer_code: text
      customer_name: text
      customer_address: text
      customer_phone: text
      customer_email: text
    primary_key: &id005
    - customer_id
    grain: *id005
  Products:
    columns:
      product_id: number
      product_type_code: text
      product_name: text
      product_price: number
    primary_key: &id006
    - product_id
    grain: *id006
  Supplier_Addresses:
    columns:
      supplier_id: number
      address_id: number
      date_from: time
      date_to: time
    primary_key: &id007
    - supplier_id
    - address_id
    grain: *id007
    observed_unique:
    - - address_id
    observed_non_unique:
    - - supplier_id
    foreign_keys:
    - columns:
      - supplier_id
      references:
        table: Suppliers
        columns:
        - supplier_id
      many_allowed: true
    - columns:
      - address_id
      references:
        table: Addresses
        columns:
        - address_id
      many_allowed: true
  Customer_Addresses:
    columns:
      customer_id: number
      address_id: number
      date_from: time
      date_to: time
    primary_key: &id008
    - customer_id
    - address_id
    grain: *id008
    observed_non_unique:
    - - customer_id
    - - address_id
    foreign_keys:
    - columns:
      - customer_id
      references:
        table: Customers
        columns:
        - customer_id
      many_allowed: true
    - columns:
      - address_id
      references:
        table: Addresses
        columns:
        - address_id
      many_allowed: true
  Customer_Orders:
    columns:
      order_id: number
      customer_id: number
      order_status_code: text
      order_date: time
    primary_key: &id009
    - order_id
    grain: *id009
    observed_non_unique:
    - - customer_id
    foreign_keys:
    - columns:
      - customer_id
      references:
        table: Customers
        columns:
        - customer_id
      many_allowed: true
  Department_Stores:
    columns:
      dept_store_id: number
      dept_store_chain_id: number
      store_name: text
      store_address: text
      store_phone: text
      store_email: text
    primary_key: &id010
    - dept_store_id
    grain: *id010
    observed_non_unique:
    - - dept_store_chain_id
    foreign_keys:
    - columns:
      - dept_store_chain_id
      references:
        table: Department_Store_Chain
        columns:
        - dept_store_chain_id
      many_allowed: true
  Departments:
    columns:
      department_id: number
      dept_store_id: number
      department_name: text
    primary_key: &id011
    - department_id
    grain: *id011
    observed_non_unique:
    - - dept_store_id
    foreign_keys:
    - columns:
      - dept_store_id
      references:
        table: Department_Stores
        columns:
        - dept_store_id
      many_allowed: true
  Order_Items:
    columns:
      order_item_id: number
      order_id: number
      product_id: number
    primary_key: &id012
    - order_item_id
    grain: *id012
    observed_non_unique:
    - - product_id
    - - order_id
    foreign_keys:
    - columns:
      - product_id
      references:
        table: Products
        columns:
        - product_id
      many_allowed: true
    - columns:
      - order_id
      references:
        table: Customer_Orders
        columns:
        - order_id
      many_allowed: true
  Product_Suppliers:
    columns:
      product_id: number
      supplier_id: number
      date_supplied_from: time
      date_supplied_to: time
      total_amount_purchased: text
      total_value_purchased: number
    primary_key: &id013
    - product_id
    - supplier_id
    grain: *id013
    observed_non_unique:
    - - product_id
    - - supplier_id
    foreign_keys:
    - columns:
      - product_id
      references:
        table: Products
        columns:
        - product_id
      many_allowed: true
    - columns:
      - supplier_id
      references:
        table: Suppliers
        columns:
        - supplier_id
      many_allowed: true
  Staff_Department_Assignments:
    columns:
      staff_id: number
      department_id: number
      date_assigned_from: time
      job_title_code: text
      date_assigned_to: time
    primary_key: &id014
    - staff_id
    - department_id
    grain: *id014
    observed_non_unique:
    - - staff_id
    - - department_id
    foreign_keys:
    - columns:
      - staff_id
      references:
        table: Staff
        columns:
        - staff_id
      many_allowed: true
    - columns:
      - department_id
      references:
        table: Departments
        columns:
        - department_id
      many_allowed: true
