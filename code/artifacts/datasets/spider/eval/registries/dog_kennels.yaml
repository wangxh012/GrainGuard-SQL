tables:
  Breeds:
    columns:
      breed_code: text
      breed_name: text
    primary_key: &id001
    - breed_code
    grain: *id001
  Charges:
    columns:
      charge_id: number
      charge_type: text
      charge_amount: number
    primary_key: &id002
    - charge_id
    grain: *id002
  Sizes:
    columns:
      size_code: text
      size_description: text
    primary_key: &id003
    - size_code
    grain: *id003
  Treatment_Types:
    columns:
      treatment_type_code: text
      treatment_type_description: text
    primary_key: &id004
    - treatment_type_code
    grain: *id004
  Owners:
    columns:
      owner_id: number
      first_name: text
      last_name: text
      street: text
      city: text
      state: text
      zip_code: text
      email_address: text
      home_phone: text
      cell_number: text
    primary_key: &id005
    - owner_id
    grain: *id005
  Dogs:
    columns:
      dog_id: number
      owner_id: number
      abandoned_yn: text
      breed_code: text
      size_code: text
      name: text
      age: text
      date_of_birth: time
      gender: text
      weight: text
      date_arrived: time
      date_adopted: time
      date_departed: time
    primary_key: &id006
    - dog_id
    grain: *id006
    observed_non_unique:
    - - owner_id
    - - size_code
    - - breed_code
    foreign_keys:
    - columns:
      - owner_id
      references:
        table: Owners
        columns:
        - owner_id
      many_allowed: true
    - columns:
      - owner_id
      references:
        table: Owners
        columns:
        - owner_id
      many_allowed: true
    - columns:
      - size_code
      references:
        table: Sizes
        columns:
        - size_code
      many_allowed: true
    - columns:
      - breed_code
      references:
        table: Breeds
        columns:
        - breed_code
      many_allowed: true
  Professionals:
    columns:
      professional_id: number
      role_code: text
      first_name: text
      street: text
      city: text
      state: text
      zip_code: text
      last_name: text
      email_address: text
      home_phone: text
      cell_number: text
    primary_key: &id007
    - professional_id
    grain: *id007
  Treatments:
    columns:
      treatment_id: number
      dog_id: number
      professional_id: number
      treatment_type_code: text
      date_of_treatment: time
      cost_of_treatment: number
    primary_key: &id008
    - treatment_id
    grain: *id008
    observed_non_unique:
    - - dog_id
    - - professional_id
    - - treatment_type_code
    foreign_keys:
    - columns:
      - dog_id
      references:
        table: Dogs
        columns:
        - dog_id
      many_allowed: true
    - columns:
      - professional_id
      references:
        table: Professionals
        columns:
        - professional_id
      many_allowed: true
    - columns:
      - treatment_type_code
      references:
        table: Treatment_Types
        columns:
        - treatment_type_code
      many_allowed: true
