tables:
  bank:
    columns:
      branch_ID: number
      bname: text
      no_of_customers: number
      city: text
      state: text
    primary_key: &id001
    - branch_ID
    grain: *id001
  customer:
    columns:
      cust_ID: text
      cust_name: text
      acc_type: text
      acc_bal: number
      no_of_loans: number
      credit_score: number
      branch_ID: number
      state: text
    primary_key: &id002
    - cust_ID
    grain: *id002
    observed_unique:
    - - branch_ID
    foreign_keys:
    - columns:
      - branch_ID
      references:
        table: bank
        columns:
        - branch_ID
      many_allowed: true
  loan:
    columns:
      loan_ID: text
      loan_type: text
      cust_ID: text
      branch_ID: text
      amount: number
    primary_key: &id003
    - loan_ID
    grain: *id003
    observed_unique:
    - - branch_ID
    foreign_keys:
    - columns:
      - branch_ID
      references:
        table: bank
        columns:
        - branch_ID
      many_allowed: true
