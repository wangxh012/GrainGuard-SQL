tables:
  Student:
    columns:
      StuID: number
      LName: text
      Fname: text
      Age: number
      Sex: text
      Major: number
      Advisor: number
      city_code: text
    primary_key: &id001
    - StuID
    grain: *id001
  Faculty:
    columns:
      FacID: number
      Lname: text
      Fname: text
      Rank: text
      Sex: text
      Phone: number
      Room: text
      Building: text
    primary_key: &id002
    - FacID
    grain: *id002
  Department:
    columns:
      DNO: number
      Division: text
      DName: text
      Room: text
      Building: text
      DPhone: number
    primary_key: &id003
    - DNO
    grain: *id003
  Member_of:
    columns:
      FacID: number
      DNO: number
      Appt_Type: text
    primary_key: []
    grain:
    - FacID
    observed_non_unique:
    - - DNO
    - - FacID
    foreign_keys:
    - columns:
      - DNO
      references:
        table: Department
        columns:
        - DNO
      many_allowed: true
    - columns:
      - FacID
      references:
        table: Faculty
        columns:
        - FacID
      many_allowed: true
  Course:
    columns:
      CID: text
      CName: text
      Credits: number
      Instructor: number
      Days: text
      Hours: text
      DNO: number
    primary_key: &id004
    - CID
    grain: *id004
    observed_non_unique:
    - - DNO
    - - Instructor
    foreign_keys:
    - columns:
      - DNO
      references:
        table: Department
        columns:
        - DNO
      many_allowed: true
    - columns:
      - Instructor
      references:
        table: Faculty
        columns:
        - FacID
      many_allowed: true
  Minor_in:
    columns:
      StuID: number
      DNO: number
    primary_key: []
    grain:
    - StuID
    observed_unique:
    - - StuID
    observed_non_unique:
    - - DNO
    foreign_keys:
    - columns:
      - DNO
      references:
        table: Department
        columns:
        - DNO
      many_allowed: true
    - columns:
      - StuID
      references:
        table: Student
        columns:
        - StuID
      many_allowed: true
  Enrolled_in:
    columns:
      StuID: number
      CID: text
      Grade: text
    primary_key: []
    grain:
    - StuID
    observed_non_unique:
    - - Grade
    - - CID
    - - StuID
    foreign_keys:
    - columns:
      - Grade
      references:
        table: Gradeconversion
        columns:
        - lettergrade
      many_allowed: true
    - columns:
      - CID
      references:
        table: Course
        columns:
        - CID
      many_allowed: true
    - columns:
      - StuID
      references:
        table: Student
        columns:
        - StuID
      many_allowed: true
  Gradeconversion:
    columns:
      lettergrade: text
      gradepoint: number
    primary_key: &id005
    - lettergrade
    grain: *id005
