tables:
  event:
    columns:
      event_id: text
      event_name: text
      event_date: text
      type: text
      notes: text
      location: text
      status: text
    primary_key: &id001
    - event_id
    grain: *id001
  major:
    columns:
      major_id: text
      major_name: text
      department: text
      college: text
    primary_key: &id002
    - major_id
    grain: *id002
  zip_code:
    columns:
      zip_code: integer
      type: text
      city: text
      county: text
      state: text
      short_state: text
    primary_key: &id003
    - zip_code
    grain: *id003
  attendance:
    columns:
      link_to_event: text
      link_to_member: text
    primary_key: &id004
    - link_to_event
    - link_to_member
    grain: *id004
    observed_unique:
    - - link_to_member
      - link_to_event
    observed_non_unique:
    - - link_to_member
    - - link_to_event
    foreign_keys:
    - columns:
      - link_to_member
      references:
        table: member
        columns:
        - member_id
      many_allowed: true
    - columns:
      - link_to_event
      references:
        table: event
        columns:
        - event_id
      many_allowed: true
  budget:
    columns:
      budget_id: text
      category: text
      spent: real
      remaining: real
      amount: integer
      event_status: text
      link_to_event: text
    primary_key: &id005
    - budget_id
    grain: *id005
    observed_non_unique:
    - - link_to_event
    foreign_keys:
    - columns:
      - link_to_event
      references:
        table: event
        columns:
        - event_id
      many_allowed: true
  expense:
    columns:
      expense_id: text
      expense_description: text
      expense_date: text
      cost: real
      approved: text
      link_to_member: text
      link_to_budget: text
    primary_key: &id006
    - expense_id
    grain: *id006
    observed_non_unique:
    - - link_to_member
    - - link_to_budget
    - - link_to_member
      - link_to_budget
    foreign_keys:
    - columns:
      - link_to_member
      references:
        table: member
        columns:
        - member_id
      many_allowed: true
    - columns:
      - link_to_budget
      references:
        table: budget
        columns:
        - budget_id
      many_allowed: true
  income:
    columns:
      income_id: text
      date_received: text
      amount: integer
      source: text
      notes: text
      link_to_member: text
    primary_key: &id007
    - income_id
    grain: *id007
    observed_non_unique:
    - - link_to_member
    foreign_keys:
    - columns:
      - link_to_member
      references:
        table: member
        columns:
        - member_id
      many_allowed: true
  member:
    columns:
      member_id: text
      first_name: text
      last_name: text
      email: text
      position: text
      t_shirt_size: text
      phone: text
      zip: integer
      link_to_major: text
    primary_key: &id008
    - member_id
    grain: *id008
    observed_unique:
    - - zip
    - - zip
      - link_to_major
    observed_non_unique:
    - - link_to_major
    foreign_keys:
    - columns:
      - zip
      references:
        table: zip_code
        columns:
        - zip_code
      many_allowed: true
    - columns:
      - link_to_major
      references:
        table: major
        columns:
        - major_id
      many_allowed: true
